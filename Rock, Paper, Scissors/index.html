<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Rock, Paper, Scissors</h1>
    <div class="choices">
        <button class="choice" data-choice="rock">Rock</button>
        <button class="choice" data-choice="paper">Paper</button>
        <button class="choice" data-choice="scissors">Scissors</button>
    </div>
    <div id="result" class="result">
        <p>User's choice: <span id="userChoice"></span></p>
        <p>Computer's choice: <span id="computerChoice"></span></p>
        <p>Result: <span id="gameResult"></span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
