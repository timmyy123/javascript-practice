<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="utf-8">
       <link rel="stylesheet" href="styles.css">
       <title>Inventory management</title> 
    </head>
    <body>
        <div class="management">
            <h1 class="welcome">Inventory Management System</h1>
            <input type="text" id="name" placeholder="Item Name">
            <input type="number" id="quantity" placeholder="Quantity">
            <button id="add" onclick="addItem()">Add Item</button>
            <button id="update" onclick="updateQuantity()">Update Quality</button>
            <button id="remove" onclick="removeItem()">Remove Item</button>
            <h2>Inventory List</h2>
            <div class="inventory list"> 
                <ul id="itemList"></ul>              
            </div>

        </div>
        <script src="script.js"></script>
    </body>

</html>
